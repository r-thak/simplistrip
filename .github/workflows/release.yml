name: Release

# Push a tag like "v1.5" (matching the manifest.json version) to build the
# extension and publish it as a GitHub release with the .zip attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npx web-ext lint --source-dir .

      - name: Build extension
        run: npx web-ext build --source-dir . --artifacts-dir web-ext-artifacts --ignore-files package.json package-lock.json

      # The manifest is plain Manifest V3 with no Firefox-only APIs, so the
      # same package works unmodified in both browsers. Ship it under both
      # names so it's easy to find in the release regardless of which
      # browser you're installing it for.
      - name: Name packages per browser
        run: |
          cd web-ext-artifacts
          src=$(ls ./*.zip)
          cp "$src" "simplistrip-firefox-${{ github.ref_name }}.zip"
          cp "$src" "simplistrip-chrome-${{ github.ref_name }}.zip"
          rm "$src"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" web-ext-artifacts/*.zip --title "${{ github.ref_name }}" --generate-notes
