name: Release

# Push a tag like "v1.5.1" (matching the manifest.json version) to build the
# extension, sign it with Mozilla (AMO), and publish both as a GitHub
# release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npx web-ext lint --source-dir .

      # Chrome doesn't require signing to side-load (unpack the zip and
      # "Load unpacked" in developer mode), so ship the plain build for it.
      - name: Build Chrome package
        run: npx web-ext build --source-dir . --artifacts-dir web-ext-artifacts --ignore-files package.json package-lock.json
      - name: Name Chrome package
        run: mv web-ext-artifacts/*.zip "web-ext-artifacts/simplistrip-chrome-${{ github.ref_name }}.zip"

      # Firefox requires an add-on to be signed by Mozilla to install
      # without disabling signature enforcement, so submit the build to AMO
      # and let it hand back a signed .xpi. This uploads as a new version of
      # the *existing* AMO listing (matched by the manifest's gecko id), not
      # a new listing, so it won't hit "duplicate add-on ID" like a manual
      # web UI submission can.
      #
      # This add-on is listed publicly on AMO, so the new version also goes
      # through Mozilla's review queue. web-ext waits up to 15 minutes
      # (its default) for that to clear before downloading the signed .xpi.
      # If review takes longer, this step times out but the version is
      # still submitted and under review on AMO.
      #
      # web-ext always tries to *submit a new* version, so simply re-running
      # this job after a timeout hits a 409 "Version already exists" instead
      # of picking up the submission that's already in review. If that
      # happens, fall back to fetching the signed file straight from AMO's
      # public versions API - this only succeeds once that version has
      # actually cleared review, so a version still pending correctly fails
      # this step again (re-run once more after it's approved).
      - name: Sign Firefox package with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if npx web-ext sign --source-dir . --artifacts-dir web-ext-artifacts --channel listed --ignore-files package.json package-lock.json; then
            exit 0
          fi

          echo "::warning::web-ext sign failed; checking whether this version was already submitted and has since been approved on AMO"

          GECKO_ID=$(node -p "require('./manifest.json').browser_specific_settings.gecko.id")
          VERSION=$(node -p "require('./manifest.json').version")

          FILE_URL=$(curl -sf "https://addons.mozilla.org/api/v5/addons/addon/${GECKO_ID}/versions/" \
            | jq -r --arg v "$VERSION" '.results[] | select(.version == $v and .file.status == "public") | .file.url // empty')

          if [ -z "$FILE_URL" ]; then
            echo "::error::No public signed file found for version ${VERSION} on AMO. It's likely still in review - re-run this job once it's approved."
            exit 1
          fi

          echo "Found an already-approved signed file for ${VERSION} on AMO, downloading it instead of resubmitting"
          curl -sfL -o "web-ext-artifacts/simplistrip-${VERSION}.xpi" "$FILE_URL"
      - name: Name Firefox package
        run: mv web-ext-artifacts/*.xpi "web-ext-artifacts/simplistrip-firefox-${{ github.ref_name }}.xpi"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            web-ext-artifacts/simplistrip-chrome-${{ github.ref_name }}.zip \
            web-ext-artifacts/simplistrip-firefox-${{ github.ref_name }}.xpi \
            --title "${{ github.ref_name }}" --generate-notes
